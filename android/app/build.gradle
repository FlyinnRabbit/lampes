plugins {
    id 'com.android.application'
}

// numéro de build GitHub : chaque APK a un numéro plus grand que le précédent
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'be.lampes.app'
    compileSdk 34

    defaultConfig {
        applicationId 'be.lampes.app'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "18." + runNumber
    }

    // deux apps à partir du même code : Lamps (l'app complète) et Lamps Arcade (Snake et Tetris sur le rideau)
    flavorDimensions 'app'
    productFlavors {
        lamps {
            dimension 'app'
            resValue 'string', 'app_name', 'Lamps'
        }
        arcade {
            dimension 'app'
            applicationIdSuffix '.arcade'
            resValue 'string', 'app_name', 'Lamps Arcade'
        }
    }

    // Clé fixe : chaque nouvel APK s'installe par-dessus l'ancien sans perdre les réglages
    signingConfigs {
        lampes {
            storeFile file('lampes.keystore')
            storePassword 'lampes123'
            keyAlias 'lampes'
            keyPassword 'lampes123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.lampes }
        release {
            signingConfig signingConfigs.lampes
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
