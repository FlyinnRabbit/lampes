name: Build the APK and the PC installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # the same page runs on the PC and on the phone
      - name: Copy the page into the app
        run: |
          mkdir -p android/app/src/main/assets
          cp web/lampes-bt.html android/app/src/main/assets/index.html
          mkdir -p android/app/src/arcade/assets
          cp web/arcade.html android/app/src/arcade/assets/index.html

      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: |
          cp android/app/build/outputs/apk/lamps/release/app-lamps-release.apk Lampes.apk
          cp android/app/build/outputs/apk/arcade/release/app-arcade-release.apk Lamps-Arcade.apk

      # PC installer: installer header + the page, in one self-contained Windows file
      - name: Build the PC installer
        run: |
          VERSION=$(grep -o 'version [0-9]*</span>' web/lampes-bt.html | grep -o '[0-9]*')
          sed "s/__VERSION__/$VERSION/g" pc/installer-head.cmd > Install-Lamps.cmd
          sed 's/\r$//; s/$/\r/' web/lampes-bt.html >> Install-Lamps.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: Lamps
          path: |
            Lampes.apk
            Lamps-Arcade.apk
            Install-Lamps.cmd

      # publish both files in "Releases": direct links for the phone and the PC
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" Lampes.apk Lamps-Arcade.apk Install-Lamps.cmd --title "Lamps $TAG" \
            --notes "Phone: Lampes.apk (lamps app) and Lamps-Arcade.apk (Snake and Tetris on the curtain). PC (Windows): download Install-Lamps.cmd and double-click it." --latest
