name: Fabriquer l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # la même page sert au PC et au téléphone
      - name: Copier la page dans l'app
        run: |
          mkdir -p android/app/src/main/assets
          cp web/lampes-bt.html android/app/src/main/assets/index.html

      - name: Construire
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk Lampes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Lampes-apk
          path: Lampes.apk

      # publie l'APK dans « Releases » : lien direct à ouvrir sur le téléphone
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" Lampes.apk --title "Lampes $TAG" \
            --notes "Télécharge Lampes.apk sur ton téléphone Android et ouvre-le pour l'installer." --latest
